<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Yuan Benedict A. Chavez, a software engineer — projects, experience, and skills."
    />
    <title>Yuan Benedict A. Chavez — Portfolio</title>

    <!-- Set the theme class before first paint so there's no flash of
         the wrong theme. Reads a previously saved choice; falls back
         to the OS-level preference; defaults to dark. Kept tiny and
         inline (not a src file) since it must block render. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          if (theme === 'light') document.documentElement.classList.add('light')
        } catch (e) {
          /* localStorage/matchMedia unavailable — default dark stands */
        }
      })()
    </script>

    <!-- Preconnect for font performance -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Display face: Clash Display (Fontshare) — bold geometric headlines -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <!-- Body face: Switzer (Fontshare) — clean grotesque for readability -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap"
      rel="stylesheet"
    />
    <!-- Utility/mono face: JetBrains Mono — labels, eyebrows, tags -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
